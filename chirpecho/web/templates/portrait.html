{% if creature.portrait %}<img class="species-portrait" src="{{ url_for('static', filename='species/' + creature.portrait + ('-locked' if portrait_locked|default(false) else '') + '.svg') }}" alt="{{ 'Undiscovered silhouette' if portrait_locked|default(false) else 'Cartoon portrait' }} of {{ creature.name }}" width="300" height="200" loading="lazy">{% else %}<div class="unknown-portrait" role="img" aria-label="Species portrait not yet available">?</div>{% endif %}
