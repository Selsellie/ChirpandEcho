{% set locked = portrait_locked|default(false) %}
{% if creature.portrait %}<img class="species-portrait{{ ' silhouette' if locked else '' }}" src="{{ url_for('static', filename='species/' + creature.portrait + '-pokemon.webp',v=creature.portrait_version) }}" alt="{{ 'Undiscovered silhouette' if locked else 'Cartoon portrait' }} of {{ creature.name }}" width="300" height="200" loading="lazy">{% else %}<div class="unknown-portrait" role="img" aria-label="Species portrait not yet available">?</div>{% endif %}
