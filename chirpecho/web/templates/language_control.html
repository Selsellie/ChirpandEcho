<form class="language-control" method="post" action="{{ url_for('set_language') }}" data-language="{{ language }}"><input type="hidden" name="next" value="{{ language_return }}"><span lang="en">EN</span><label class="language-switch"><input type="checkbox" name="lang" value="nl" role="switch" aria-label="Language: English or Dutch" {% if language == 'nl' %}checked{% endif %}><span aria-hidden="true" class="language-slider"></span></label><span lang="nl">NL</span><noscript><button type="submit">Change language</button></noscript></form>
